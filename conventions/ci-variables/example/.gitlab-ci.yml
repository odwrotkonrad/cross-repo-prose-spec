##[>] 🤖🤖
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate

variables:
  CI_IMAGE: $GRP_VAR_ARTIFACT_REGISTRY/ci-linux:$GRP_VAR_CI_IMAGES_REF
  GITLAB_TOKEN: $REPO_VAR_GITLAB_TOKEN
  CHE_PACKAGES_REF: $GRP_VAR_CHE_PACKAGES_REF

default:
  image: $CI_IMAGE
  tags:
    - gke-linux-amd64

validate-pre-commit-diff:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - make repo-ci-precommit-diff
    - git diff --exit-code HEAD

publish:
  stage: validate
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    TF_VAR_github_token: $REPO_VAR_GITHUB_TOKEN
  script:
    - make publish
##[<] 🤖🤖
